# GitHub only honors "Closes #N" for PRs merged into the default branch (main).
# Every task PR targets dev, so this workflow closes the referenced issues instead.
name: Close issues on merge into dev

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = new Set();
            for (const match of (pr.body || "").matchAll(pattern)) {
              numbers.add(Number(match[1]));
            }
            if (numbers.size === 0) {
              core.info("No closing keywords found in the PR body.");
              return;
            }
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === "closed") {
                core.info(`Skipping #${issue_number} (pull request or already closed).`);
                continue;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Fechada pelo merge de #${pr.number} na \`dev\`.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed #${issue_number}.`);
            }
